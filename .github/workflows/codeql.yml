---
name: "Code Quality Analysis"

on:
  push:
    branches:
      # Our work lives on cuesoft/customizations, which is the default branch.
      # main only tracks upstream, so scanning it alone scanned nothing of ours.
      - cuesoft/customizations
      - main
    paths:
      - apps/**
      - '!apps/docs/**'
      - libraries/**


jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    runs-on: 'ubuntu-latest'
    permissions:
      # Once ANY permissions block exists every unlisted scope becomes `none`,
      # so security-events alone left contents at none and both checkout and
      # codeql-action/init would fail. That went unnoticed because this workflow
      # triggers on `main` while the default branch moved to
      # cuesoft/customizations, so it effectively stopped running (2026-08-14).
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          category: "/language:${{matrix.language}}"
