name: cuesoft-build-image

# Builds the Cuesoft-patched Postiz image (SSO-only login + Google-SSO callback fix)
# and pushes it to GHCR. Native arm64 (matches the self-hosted host) via GitHub's
# arm64 hosted runner — no QEMU.

on:
  push:
    branches: [cuesoft/customizations]
    # Every path that can change the image MUST be listed. A commit that
    # touches only an omitted path publishes nothing, and `cuesoft-latest` +
    # the version tag keep pointing at the previous build - a stale image that
    # looks current. Dockerfile.dev does `COPY . /app` then `pnpm install` and
    # `pnpm run build`, so the blast radius is wide; anything below is either
    # copied into the context or consumed by one of those two commands.
    paths:
      - 'apps/**'
      - 'libraries/**'
      - 'var/**' # nginx.conf etc — baked into the image
      - 'Dockerfile.dev'
      # a lockfile-only change still has to rebuild the dependency layer
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      # added 2026-08-13 - all three were missing and all three change the build:
      #   tsconfig.base.json  both apps/frontend and apps/backend extend it,
      #                       and it owns the @gitroom/* path aliases; root
      #                       tsconfig.json just re-extends it (glob covers both)
      #   .npmrc              pnpm resolution itself (node-linker=hoisted,
      #                       inject-workspace-packages) - changes what
      #                       `pnpm install` produces
      #   .dockerignore       decides what `COPY . /app` actually copies
      - 'tsconfig*.json'
      - '.npmrc'
      - '.dockerignore'
      - '.github/workflows/cuesoft-build-image.yml'
  workflow_dispatch:

concurrency:
  group: cuesoft-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (best-effort)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_VERSION=v2.23.0
          # sha- tag = immutable rollback point; the mutable tags move with every push
          tags: |
            ghcr.io/cuesoftinc/postiz-app:v2.23.0-sso
            ghcr.io/cuesoftinc/postiz-app:cuesoft-latest
            ghcr.io/cuesoftinc/postiz-app:sha-${{ github.sha }}
