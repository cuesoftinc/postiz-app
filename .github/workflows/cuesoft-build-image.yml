name: cuesoft-build-image

# Builds the Cuesoft-patched Postiz image (SSO-only login + Google-SSO callback fix)
# and pushes it to GHCR. Native arm64 (matches the self-hosted host) via GitHub's
# arm64 hosted runner — no QEMU.

on:
  push:
    branches: [cuesoft/customizations]
    paths:
      - 'apps/**'
      - 'libraries/**'
      - 'var/**' # nginx.conf etc — baked into the image
      - 'Dockerfile.dev'
      # a lockfile-only change still has to rebuild the dependency layer
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/cuesoft-build-image.yml'
  workflow_dispatch:

concurrency:
  group: cuesoft-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (best-effort)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_VERSION=v2.23.0
          # Registry-backed layer cache. Without it the runner starts cold every
          # time, so `pnpm install` re-runs and produces a byte-different
          # node_modules layer — a new digest, which the deploy host then has to
          # pull in full even though nothing about the dependencies changed.
          # That is the ~900MB-per-deploy pull. With the cache, an unchanged
          # lockfile reuses the exact same layer and the host pulls only the
          # app-build layer on top.
          cache-from: type=registry,ref=ghcr.io/cuesoftinc/postiz-app:buildcache
          cache-to: type=registry,ref=ghcr.io/cuesoftinc/postiz-app:buildcache,mode=max
          # sha- tag = immutable rollback point; the mutable tags move with every push
          tags: |
            ghcr.io/cuesoftinc/postiz-app:v2.23.0-sso
            ghcr.io/cuesoftinc/postiz-app:cuesoft-latest
            ghcr.io/cuesoftinc/postiz-app:sha-${{ github.sha }}
