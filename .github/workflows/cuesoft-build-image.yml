name: cuesoft-build-image

# Builds the Cuesoft-patched Postiz image (SSO-only login + Google-SSO callback fix)
# and pushes it to GHCR. Native arm64 (matches the self-hosted host) via GitHub's
# arm64 hosted runner — no QEMU.

on:
  push:
    tags: ['cuesoft-v*']
  workflow_dispatch:

concurrency:
  group: cuesoft-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      # id-token + attestations are what the signed provenance step needs, and
      # they are the only reason either is granted. Sigstore mints its
      # short-lived signing cert from the OIDC token; the attestation itself is
      # stored against this repo. Nothing else here needs them.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/arm64)
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/arm64
          push: true
          # BuildKit attaches both of these to the image index in GHCR, so they
          # travel with the image and need no GitHub API to read:
          #   docker buildx imagetools inspect <ref> --format '{{json .Provenance}}'
          #   docker buildx imagetools inspect <ref> --format '{{json .SBOM}}'
          # mode=max records the full build graph (source revision, base image
          # digests, build args) rather than just the materials.
          provenance: mode=max
          sbom: true
          build-args: |
            NEXT_PUBLIC_VERSION=v2.23.0
          # Deployments consume only this immutable source-revision tag.
          tags: ghcr.io/cuesoftinc/postiz-app:sha-${{ github.sha }}
      # The BuildKit attestations above are unsigned: anyone who can write to
      # the GHCR package can rewrite them alongside the image. This step signs a
      # SLSA provenance statement for the same digest through Sigstore, keyed to
      # this repo and this workflow run, so a puller can check it came from here:
      #   gh attestation verify oci://ghcr.io/cuesoftinc/postiz-app:sha-<sha> \
      #     --repo cuesoftinc/postiz-app
      # push-to-registry stays off (the default): the attestation lives in
      # GitHub's store, which keeps the registry write path unchanged.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/cuesoftinc/postiz-app
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: Record immutable digest
        run: echo 'POSTIZ_IMAGE=ghcr.io/cuesoftinc/postiz-app@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
