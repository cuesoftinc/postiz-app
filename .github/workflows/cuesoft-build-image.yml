name: cuesoft-build-image

# Builds the Cuesoft-patched Postiz image (SSO-only login + Google-SSO callback fix)
# and pushes it to GHCR. Native arm64 (matches the self-hosted host) via GitHub's
# arm64 hosted runner — no QEMU.

on:
  push:
    tags: ['cuesoft-v*']
  workflow_dispatch:

concurrency:
  group: cuesoft-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/arm64)
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            NEXT_PUBLIC_VERSION=v2.23.0
          # Deployments consume only this immutable source-revision tag.
          tags: ghcr.io/cuesoftinc/postiz-app:sha-${{ github.sha }}
      - name: Record immutable digest
        run: echo 'POSTIZ_IMAGE=ghcr.io/cuesoftinc/postiz-app@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
