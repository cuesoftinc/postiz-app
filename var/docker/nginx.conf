worker_processes                auto; # it will be determinate automatically by the number of core
pid                             /tmp/nginx.pid;
error_log                       /dev/stderr warn;

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /dev/stdout;
    client_body_temp_path       /tmp/nginx/client_body;
    proxy_temp_path             /tmp/nginx/proxy;
    fastcgi_temp_path           /tmp/nginx/fastcgi;
    uwsgi_temp_path             /tmp/nginx/uwsgi;
    scgi_temp_path              /tmp/nginx/scgi;
    client_max_body_size 2G;
    server {
        listen 5000;
        server_name _;

        # This server is only ever reached through the Cloudflare Tunnel, which
        # terminates TLS on 443 and forwards to container port 5000. nginx's
        # default `absolute_redirect on` rebuilds a redirect from what it is
        # bound to rather than from what the client asked for, so a request for
        # https://postiz.cuesoft.io/api answered with a redirect went out as
        # `http://postiz.cuesoft.io:5000/api/`: the internal port published to
        # the world, and https downgraded to http. The port is not reachable
        # from outside, so anything that followed it hung rather than failed.
        #
        # Relative redirects carry no scheme, host or port, so the client keeps
        # the origin it already had and the tunnel stays invisible. Nothing here
        # depends on absolute Location headers; the app builds its own URLs from
        # NEXT_PUBLIC_* config, not from nginx.
        absolute_redirect off;
        port_in_redirect off;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        location /api/ {
            proxy_pass http://localhost:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
        }

        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location / {
            proxy_pass http://localhost:4200/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
    }
}
